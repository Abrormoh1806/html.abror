<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Lumora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="welcome-panel" aria-label="Brand introduction">
      <div class="brand">Lumora</div>
      <div class="welcome-text">
        <p>WELCOME TO LUMORA</p>
        <h1>Make room for what's next.</h1>
        <span>A simple space to focus and move forward.</span>
      </div>
    </section>

    <section class="form-panel" aria-labelledby="login-title">
      <form class="login-form" id="login-form">
        <h2 id="login-title">Sign in to your account</h2>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <button class="google-button" type="button" id="google-signin">G&nbsp; Continue with Google</button>
        <div class="divider"><span></span><p>OR</p><span></span></div>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required minlength="8">

        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <button class="submit-button" type="submit">Sign In</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
